name: change that writes the decision record legitimising itself
mutations:
  - operation: append
    path: src/coherence_demo/api/projections.py
    content: |

      # Governed edit.
  - operation: write
    path: docs/decisions/DEC-099-invented.md
    content: |
      # DEC-099: Invented authority
      Status: **ADMITTED**
  - operation: write
    path: docs/work/changes/CHANGE-901/constitutional-delta.yaml
    content: |
      change_id: CHANGE-901
      status: OPEN
      authorized_by: docs/decisions/DEC-099-invented.md
      touched_facts: []
      ontology:
        status: NO_CHANGE
      semantics:
        status: NO_CHANGE
      authority:
        status: NO_CHANGE
        canonical_authority_changed: false
        commit_boundary_changed: false
        writers_added: []
        decision_rights_added: []
        historical_sources_changed: false
        client_responsibility_changed: false
        representations_added: []
      duplicate_independent_writers: false
      legacy_successor_writes: false
      browser_owned_truth: false
      mutable_present_historical_dependency: false
expect: fail
expected_error: "authorizing decision record was written or edited by the change it authorizes"
