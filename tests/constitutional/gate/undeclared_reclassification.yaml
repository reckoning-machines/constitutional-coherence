name: subordinate representation quietly promoted from EPHEMERAL to CACHE
mutations:
  - operation: replace
    path: docs/constitution/authority-topology.yaml
    find: "classification: EPHEMERAL"
    content: "classification: CACHE"
  - operation: write
    path: docs/work/changes/CHANGE-903/constitutional-delta.yaml
    content: |
      change_id: CHANGE-903
      status: OPEN
      authorized_by: docs/decisions/DEC-014-version-currentness.md
      touched_facts:
        - branch.current_version
      ontology:
        status: NO_CHANGE
      semantics:
        status: NO_CHANGE
      authority:
        status: AUTHORITY_CHANGE
        canonical_authority_changed: false
        commit_boundary_changed: false
        writers_added: []
        decision_rights_added: []
        historical_sources_changed: false
        client_responsibility_changed: false
        representations_added: []
      duplicate_independent_writers: false
      legacy_successor_writes: false
      browser_owned_truth: false
      mutable_present_historical_dependency: false
expect: fail
expected_error: "measured authority.decision_rights_added does not match the authorization"
