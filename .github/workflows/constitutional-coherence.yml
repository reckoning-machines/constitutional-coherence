name: Constitutional Coherence

on:
  push:
  pull_request:

jobs:
  constitutional-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m constitutional.discover --root .
      - run: python -m constitutional.validate --root .
      - run: pytest
      - run: constitutional-coherence-demo
